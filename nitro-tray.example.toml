# Nitro Tray reference configuration.
#
# Copy this file as `nitro-tray.toml` next to the exe to customize the app.
# The file is read at startup only — restart the app to apply changes.
# Every key is optional; the values below are the baked-in defaults, so this
# file is a no-op that documents every setting. Invalid values are ignored and
# the default is used instead. Unknown keys and sections are ignored.

# Smart charge (80% charge cap) on at startup.
smart_charge = true

# Default profile on AC: "quiet" | "balanced" | "performance".
ac_profile = "balanced"

# Default profile on battery: "eco" | "balanced".
battery_profile = "eco"

# Automatically apply the profile on AC <-> battery transitions.
auto_switch = true

# Periodic firmware re-assertion loop (WMI profile, HID mode, fan auto,
# smart-charge state). Never touches the active Windows plan. Off by default.
reapply = false

# Re-assertion loop interval in seconds (>= 1).
reapply_interval_secs = 30

# Global hotkey: ctrl|alt|shift|win modifiers + key (a-z, 0-9, f1-f24),
# joined with "-". Cycle forward through the current power state's profiles.
hotkey = "ctrl-alt-p"

# Debug log to nitro-tray.log next to the exe. Off by default; the --log
# command-line flag enables it per launch regardless of this setting.
log = false
